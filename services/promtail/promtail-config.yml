server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  # Collect logs from all Docker containers via the Docker socket
  - job_name: docker
    docker_sd_configs:
      - host: unix:///var/run/docker.sock
        refresh_interval: 5s
        filters:
          - name: network
            values: ["nyc-taxi-ml"]
    relabel_configs:
      - target_label: job
        replacement: docker
      # Use container name as the label
      - source_labels: ["__meta_docker_container_name"]
        regex: "/(.*)"
        target_label: "container"
      # Add container ID
      - source_labels: ["__meta_docker_container_id"]
        target_label: "container_id"
      # Add the Docker Compose service name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_service"]
        target_label: "service"
      # Add the project name
      - source_labels: ["__meta_docker_container_label_com_docker_compose_project"]
        target_label: "project"
    pipeline_stages:
      - static_labels:
          job: docker
      # Try to parse JSON logs from our instrumented services
      - json:
          expressions:
            level: level
            message: message
            logger: logger
            trace_id: trace_id
            span_id: span_id
            service_name: service
      - labels:
          level:
          trace_id:
          service_name:
      # Fall back: keep raw log line if not JSON
      - output:
          source: message
