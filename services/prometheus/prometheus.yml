global:
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- alert_rules.yml
scrape_configs:
- job_name: prediction_api
  metrics_path: /metrics
  static_configs:
  - targets:
    - prediction_api:8000
    labels:
      service: prediction_api
      layer: application
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      layer: platform
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
    labels:
      layer: platform
- job_name: pipeline
  honor_labels: true
  static_configs:
  - targets:
    - pushgateway:9091
