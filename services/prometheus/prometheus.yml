global:
  # 5 s is a demo choice: an outage or a latency spike is visible within ~15 s. Production usually
  # uses 15-30 s. Rule windows below (1m) stay >= 12x this interval, so they remain smooth.
  scrape_interval: 5s
  evaluation_interval: 5s
rule_files:
- alert_rules.yml
alerting:
  alertmanagers:
  - static_configs:
    - targets: [alertmanager:9093]
scrape_configs:
- job_name: prediction_api
  metrics_path: /metrics
  static_configs:
  - targets:
    - prediction_api:8000
    labels:
      service: prediction_api
      layer: application
- job_name: prometheus
  static_configs:
  - targets:
    - localhost:9090
    labels:
      layer: platform
- job_name: loki
  static_configs:
  - targets:
    - loki:3100
    labels:
      layer: platform
- job_name: pipeline
  honor_labels: true
  static_configs:
  - targets:
    - pushgateway:9091
- job_name: alertmanager
  static_configs:
  - targets:
    - alertmanager:9093
    labels:
      layer: platform
